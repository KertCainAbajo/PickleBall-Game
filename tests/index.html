<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Engine tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #0f1720; color: #e6edf3; }
    .pass { color: #7ee787; } .fail { color: #ff7b72; } pre { white-space: pre-wrap; margin: 2px 0 8px 18px; color: #ffa198; }
  </style>
</head>
<body>
  <h1>Pickle Rally engine tests</h1>
  <p id="summary">Running…</p>
  <div id="out"></div>
  <script type="module">
    import { tests } from './engine.test.js';
    const out = document.getElementById('out');
    let pass = 0;
    for (const t of tests) {
      const row = document.createElement('div');
      const t0 = performance.now();
      try { await t.fn(); pass++; row.className = 'pass'; row.textContent = `✓ ${t.name} (${(performance.now() - t0).toFixed(0)} ms)`; }
      catch (e) { row.className = 'fail'; row.innerHTML = `✗ ${t.name}<pre>${e.stack || e}</pre>`; }
      out.append(row);
    }
    const summary = `${pass}/${tests.length} passed`;
    document.getElementById('summary').textContent = summary + (window.__aiFaults ? ` · AI faults by type: ${JSON.stringify(window.__aiFaults)}` : '');
    document.title = (pass === tests.length ? 'PASS ' : 'FAIL ') + summary;
  </script>
</body>
</html>
